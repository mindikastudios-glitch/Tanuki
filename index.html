<style>
:root{--bg:#0f0f14;--side:#14141b;--surf:#1b1b25;--hov:#232331;--bd:#2a2a38;--tx:#ececf4;--mut:#9a9ab0;--ac:#7c5cff;--acx:#fff;--sel:#262046;--dg:#ef5b6b;--r:12px;color-scheme:dark}
:root[data-eff="light"]{--bg:#fafafc;--side:#f0f0f6;--surf:#fff;--hov:#e8e8f1;--bd:#dcdce8;--tx:#17171f;--mut:#62627a;--ac:#6a45f5;--sel:#e6e0ff;--dg:#c92f40;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.ib:hover{background:var(--hov);color:var(--tx)}
#app{display:flex;height:100%}
#side{width:290px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px;gap:10px;transition:width .2s;flex:none;min-height:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.tile{display:grid;place-items:center;flex:none}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.t36{width:46px;height:32px}.t56{width:92px;height:30px}:root[data-eff="dark"] .tile img,:root[data-eff="dark"] .fav{filter:invert(1)}
.newbtn{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--ac);color:var(--acx);border-radius:var(--r);padding:10px;font-weight:600;transition:filter .15s}
.newbtn:hover{filter:brightness(1.1)}
.srch{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:0 6px 0 10px;color:var(--mut)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;padding:9px 0;color:var(--tx)}
.srch:focus-within{border-color:var(--ac)}
.srch .ib{width:28px;height:28px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.ci{display:flex;align-items:center;border-radius:10px;position:relative}
.ci:hover{background:var(--hov)}
.ci.on{background:var(--sel)}
.ci .open{flex:1;min-width:0;text-align:left;padding:8px 4px 8px 10px;display:block}
.ci .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci .d{display:block;font-size:11.5px;color:var(--mut)}
.ci .ib{width:30px;height:30px;margin-right:4px}
.empty{color:var(--mut);text-align:center;padding:24px 8px;font-size:14px}
.sf{border-top:1px solid var(--bd);padding-top:10px}
.sf button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:var(--mut)}
.sf button:hover{background:var(--hov);color:var(--tx)}
.collapsed #side{width:64px;align-items:center}
.collapsed .lb,.collapsed .t56,.collapsed #list{display:none}
.collapsed .sh{flex-direction:column;gap:10px}
.collapsed .newbtn,.collapsed .sf button{width:40px;height:40px;padding:0;justify-content:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:52px}
.top .mbtn{display:none}
#ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scroll{flex:1;overflow-y:auto;min-height:0}
#msgs{max-width:780px;margin:0 auto;padding:12px 18px 24px;display:flex;flex-direction:column;gap:22px;min-height:100%}
.welcome{margin:auto;text-align:center;padding:12px 0}
.welcome .tile{width:min(280px,72vw);margin:0 auto 18px}.welcome .tile img{height:auto}
.welcome h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.welcome p{color:var(--mut);margin:0 0 20px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button{border:1px solid var(--bd);background:var(--surf);border-radius:999px;padding:8px 14px;font-size:14px;transition:border-color .15s,background .15s}
.sug button:hover{border-color:var(--ac);background:var(--hov)}
.m{display:flex;flex-direction:column;gap:6px;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.m.u{align-items:flex-end}
.m.u .b{background:var(--sel);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a .b{overflow-wrap:anywhere;max-width:100%}
.m.a .b p{margin:0 0 .7em}.m.a .b p:last-child{margin:0}
.m.a pre{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto}
.m.a code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.m.a a{color:var(--ac)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.meta .ib{width:28px;height:28px}
.fl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fc{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:6px 10px 6px 6px;max-width:240px;font-size:13px}

/* ===== Tanuki · rediseño con cara pixelada (solo presentación) ===== */
#app{height:var(--vvh,100%)}
html.kb body{padding-bottom:0}
html.kb #app{height:calc(var(--vvh) - env(safe-area-inset-top,0px));transform:translateY(var(--vvt,0px))}

#scroll{flex:none;height:var(--hist-h,120px);margin-top:auto;

.comp{max-width:760px;padding:6px 12px 10px}
.box{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:4px 6px;padding:6px 8px 6px 6px;

<script id="face-js">
/* ==========================================================================
   TANUKI · CARA PIXELADA
   Motor independiente de la lógica del chat. Solo LEE el estado `busy` de la
   app y recibe 4 avisos (send / reply / error / stop) mediante FaceFX.emit().
   Si este script falla, el chat sigue funcionando igual.

   API pública (window.FaceFX):
     emit(evento, ...args)      eventos: 'send' | 'reply'(texto,{mood}) | 'error' | 'stop'
     setMood(nombre, fuerza)    'joy' | 'curious' | 'surprise' | 'calm' | 'sad'
                                (punto de enlace para emociones estructuradas futuras)
     mouth                      null o 0..1: fuerza la apertura de la boca
                                (reservado para sincronizar vocalizaciones locales)
     on(evento, fn)             'state' | 'speakStart' | 'speakEnd'
   ========================================================================== */
(()=>{
'use strict';
const cv=document.getElementById('face');
if(!cv||!cv.getContext)return;
const ctx=cv.getContext('2d',{alpha:false});
const main=cv.parentElement,root=document.documentElement;
const $=id=>document.getElementById(id);
const scrollEl=$('scroll'),msgsEl=$('msgs'),ta=$('ta'),histB=$('histb');
const head=main.querySelector('.top'),footer=main.querySelector('.comp');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,rnd=(a,b)=>a+Math.random()*(b-a);
const nowS=()=>performance.now()/1000;
const RMq=matchMedia('(prefers-reduced-motion: reduce)');let RM=RMq.matches;
RMq.addEventListener?RMq.addEventListener('change',e=>{RM=e.matches}):RMq.addListener(e=>{RM=e.matches});

/* ---------- Geometría de diseño (coordenadas de la imagen de referencia, 292×519) ---------- */
const DCX=147.25,DCY=235.5,DW=296,DH=238,CELLU=.72,SMAX=3.1;
const EYE_X=74.5,EYE_Y=268,EYE_RX=20.5,EYE_RY=30;
const EAR_OUT=[[38,198],[58.5,132],[98,170.5]];          /* contorno exterior (abierto abajo) */
const EAR_IN=[[60,151],[84,172],[50,190]];                /* triángulo interior relleno */
const EAR_PIV=[66,192];
const WHISK=[[[19,296],[48,303]],[[23,322],[47,314]],[[32,341],[52,328]]]; /* [extremo, base] */
const MOUTH_Y=306.5,MOUTH_W=24.5;

/* ---------- Resortes (interpolación suave y orgánica de cada rasgo) ---------- */
const mk=(v,w=9,z=.88)=>({v,t:v,x:0,w,z});
const S={eyeW:mk(1),eyeH:mk(1),lid:mk(0,11),slant:mk(0,10),happy:mk(0,8),gx:mk(0,24,.8),gy:mk(0,24,.8),
 depth:mk(14,9),mw:mk(1,9),open:mk(0,26,.75),earL:mk(0,10,.62),earR:mk(0,10,.62),lift:mk(0,9),wr:mk(0,8,.7),
 bright:mk(1,6,1),hx:mk(0,7),hy:mk(0,8),hr:mk(0,7)};

function stepS(dt){const n=dt>.025?2:1,h=dt/n;
 for(let k=0;k<KEYS.length;k++){const p=S[KEYS[k]];for(let q=0;q<n;q++){p.x+=(p.w*p.w*(p.t-p.v)-2*p.z*p.w*p.x)*h;p.v+=p.x*h}}}

/* ---------- Estados base y matices emocionales ---------- */
const ST={
 idle:   {eyeW:1,eyeH:1,lid:0,slant:0,happy:0,depth:14,mw:1,earL:0,earR:0,lift:0,wr:0,bright:1,hr:0,hy:0},
 sleep:  {eyeW:.94,eyeH:.12,lid:.96,slant:0,happy:.12,depth:5,mw:.78,earL:-.22,earR:-.18,lift:-2,wr:-.08,bright:.78,hr:-.018,hy:1.5},
 attn:   {eyeW:1.05,eyeH:1.1,lid:0,slant:0,happy:0,depth:12,mw:1,earL:.08,earR:.08,lift:4,wr:.05,bright:1.12,hr:0,hy:-1},
 think:  {eyeW:.98,eyeH:.9,lid:.12,slant:.1,happy:0,depth:4,mw:.82,earL:.14,earR:-.06,lift:0,wr:-.04,bright:.92,hr:.045,hy:0},
 speak:  {eyeW:1,eyeH:1.02,lid:0,slant:0,happy:.12,depth:12,mw:1,earL:.03,earR:.03,lift:2,wr:.03,bright:1.1,hr:0,hy:0},
 concern:{eyeW:.96,eyeH:.95,lid:.1,slant:-.38,happy:0,depth:-7,mw:.9,earL:-.3,earR:-.3,lift:-3,wr:-.2,bright:.8,hr:-.03,hy:2}};
const MOODS={
 joy:       {happy:1,depth:7,lift:4,earL:.12,earR:.12,wr:.12,bright:.08,eyeH:-.05},
 restless:  {happy:.55,eyeW:.04,eyeH:.12,lid:-.04,slant:.08,earL:.2,earR:-.18,lift:4,wr:.18,depth:3,bright:.08,hr:.035},
 playful:   {happy:.9,eyeW:.03,eyeH:-.02,slant:.12,earL:.22,earR:-.12,lift:5,wr:.22,depth:9,bright:.1,hr:.035},
 curious:   {eyeH:.1,eyeW:-.04,earR:-.12,earL:.1,lift:3,hr:.07,depth:-5,bright:.04,hy:-1},
 expressive:{happy:.7,eyeW:.08,eyeH:.12,lid:-.03,slant:.08,earL:.15,earR:.15,lift:5,wr:.16,depth:8,bright:.1,hr:.025},
 sad:       {slant:-.3,lid:.08,depth:-14,earL:-.25,earR:-.25,lift:-3,bright:-.12,eyeH:-.04,hy:2},
 fear:      {eyeW:.12,eyeH:.2,lid:-.06,slant:-.12,depth:-10,mw:1.12,earL:-.24,earR:-.24,lift:-2,wr:-.2,bright:.04,hy:2},
 surprise:  {eyeW:.16,eyeH:.28,lid:-.08,lift:6,earL:.1,earR:.1,depth:-9,mw:1.18,bright:.12},
 disgust:   {eyeW:-.08,eyeH:-.08,lid:.2,slant:-.22,depth:-3,mw:.78,earL:-.14,earR:.08,lift:-1,wr:-.25,bright:-.08,hr:-.025},
 calm:      {lid:.16,depth:0,bright:-.1,eyeH:-.04,earL:-.02,earR:-.02},
 mischievous:{happy:.72,eyeH:-.12,lid:.24,slant:.22,depth:5,mw:.9,earL:.1,earR:-.08,lift:2,wr:.1,bright:.02,hr:.025},
 tenderness:{happy:.48,eyeW:-.04,eyeH:-.12,lid:.24,slant:.04,depth:5,mw:.92,earL:.08,earR:.08,lift:1,wr:.04,bright:-.03},
 affection: {happy:.78,eyeW:.02,eyeH:.02,lid:.08,slant:.04,depth:8,mw:1.04,earL:.15,earR:.15,lift:3,wr:.12,bright:.08,hr:.012},
 gratitude: {happy:.68,eyeH:-.08,lid:.2,slant:-.04,depth:6,mw:.95,earL:.12,earR:.12,lift:2,wr:.08,bright:.02,hy:1}
};
const MOOD_LABELS={joy:'Feliz',restless:'Inquieto',playful:'Juguetón',curious:'Curioso',expressive:'Expresivo',sad:'Triste',fear:'Miedo',surprise:'Sorpresa',disgust:'Desagrado',calm:'Tranquilo',mischievous:'Pícaro',tenderness:'Ternura',affection:'Cariño',gratitude:'Gratitud'};
const MOOD_ALIASES={feliz:'joy',happy:'joy',inquieto:'restless',jugueton:'playful','juguetón':'playful',curioso:'curious',expresivo:'expressive',triste:'sad',miedo:'fear',temor:'fear',sorpresa:'surprise',desagrado:'disgust',asco:'disgust',tranquilo:'calm',calma:'calm',picaro:'mischievous','pícaro':'mischievous',ternura:'tenderness',carino:'affection','cariño':'affection',gratitud:'gratitude',agradecido:'gratitude'};
function normalizeMood(name){const n=String(name||'').toLowerCase().trim();return MOODS[n]?n:(MOOD_ALIASES[n]||'')}


/* ---------- Variables de comportamiento ---------- */
let curState='idle',prevBusy=false,speakStart=0,speakEnd=0,speakText='',errEnd=0,attnUntil=0,antic=0;
/* Vida autónoma: los gestos AFK se calculan localmente, sin llamadas a la IA. */
const SLEEP_AFTER=78; let lastActivity=nowS(),sleepBlend=0,lastPointerX=-1,lastPointerY=-1,afkSparkAt=0;
let mood='calm',moodK=0,moodStr=.6,moodHold=0,lastUserText='';
let gzNext=1.2,wanderX=0,wanderY=0,ptrX=0,ptrY=0,caret=.5;
let nextBlink=2,blinkT=-1,blinkD=.17,dbl=false,blinkV=0;
let twL=-9,twR=-9,twNext=6,scan=0;
const CH=.058;
const VOWEL={a:.9,e:.6,i:.38,o:.82,u:.55,'á':.9,'é':.6,'í':.38,'ó':.82,'ú':.55,'ü':.55,'à':.9,'è':.6,'ê':.6,'â':.9,'ô':.82,y:.3};
const mouthFor=c=>{const v=VOWEL[c];if(v!==undefined)return v;if(' .,;:!?¿¡\n-—'.indexOf(c)>=0)return 0;if('mbp'.indexOf(c)>=0)return .04;return .22};
const polledBusy=()=>{try{return !!busy}catch(e){return false}};   /* `busy` es la variable de la app */

/* ---------- Eventos hacia fuera ---------- */
const L={};const fire=(e,...a)=>{(L[e]||[]).forEach(f=>{try{f(...a)}catch(_){}})};
function cleanText(s){return s.replace(/```[\s\S]*?```/g,' ').replace(/https?:\/\/\S+/g,' ').replace(/[*#`_\[\]()>~|]/g,'').replace(/\s+/g,' ').trim().toLowerCase().slice(0,150)}
function guessMood(text, userText=''){ /* Lectura local del tono de ambos turnos; no llama a la IA. */
 const s=cleanText(String(text||'')).slice(0,900),u=cleanText(String(userText||'')).slice(0,500);
 const combined=u+' '+s;
 // Las señales más específicas tienen prioridad sobre el tono general.
 if(/gracias|te agradezco|agradecid|thank you|thanks|obrigad|merci/.test(s))return['gratitude',.82];
 if(/te quiero|te aprecio|con cariño|me importas|love you|sending love/.test(s))return['affection',.78];
 if(/qué tierno|que tierno|ternur|adorable|aww|awww|so cute/.test(s))return['tenderness',.8];
 if(/qué asco|que asco|desagrad|repugn|asco|gross|disgusting/.test(combined))return['disgust',.7];
 if(/tengo miedo|qué miedo|que miedo|asust|temor|afraid|scared|peligro|amenaz/.test(combined))return['fear',.72];
 if(/lo siento|disculp|lamento|sorry|desculp|désolé|mi dispiace|no pude conectar|qué pena|que pena/.test(s))return['sad',.58];
 if(/jaja|jajaja|jeje|jejeje|travies|broma|bromista|hehe|juguet[oó]n|playful/.test(s))return['playful',.78];
 if(/wow|increíble|increible|sorprend|no me lo esperaba|amazing|incredible|¡en serio\??|de verdad\??/.test(s))return['surprise',.68];
 if(/genial|excelente|felicid|great|awesome|congrat|parabéns|bravo|fantástic|fantastic|me alegra|qué bien|que bien|me encanta/.test(s))return['joy',.8];
 if(/¿[^?]{3,}\?|\?\s*$/.test(s.trim())||/no entiendo|qué significa|que significa|cómo funciona|como funciona|por qué|por que|explora|investiguemos/.test(u))return['curious',.72];
 if(/qué lindo|que lindo|bonit[oa]|preci[oó]s[oa]|dulce|cute/.test(combined))return['tenderness',.65];
 if(/me preocupa|estoy triste|me siento mal|difícil momento|dificil momento|perd[ií]|duelo|sad|triste/.test(combined))return['sad',.68];
 if(/jaja|jajaja|jeje|broma|divertid|gracioso|graciosa|😂|🤣/.test(combined))return['playful',.65];
 if(/interesante|curioso|curiosa|mmm|hmm|quizá|quizas|tal vez|podría ser|podria ser/.test(s))return['curious',.58];
 if(/te ayudo|vamos paso a paso|con gusto|claro que sí|claro que si|por supuesto/.test(s))return['affection',.48];
 return['calm',.5]}

function blinkSoon(t){if(blinkT<0)nextBlink=Math.min(nextBlink,t+.05)}
function startSpeak(text,opts){
 const t=nowS();speakText=cleanText(text);
 const dur=clamp(speakText.length*CH+.7,1.8,10);
 speakStart=t+.15;speakEnd=speakStart+dur;
 let m=guessMood(text,lastUserText);if(opts&&opts.mood&&MOODS[opts.mood])m=[opts.mood,opts.k||.8];
 mood=m[0];moodStr=m[1];moodHold=speakEnd+2.8;blinkSoon(t);
 fire('speakStart',{text:speakText,duration:dur,mood});setTimeout(()=>fire('speakEnd'),dur*1000+150)}
const FaceFX=window.FaceFX={
 mouth:null,
 emit(evt,a,b){const t=nowS();
  if(evt==='send'){lastActivity=t; sleepBlend=0; antic=1;attnUntil=0;blinkSoon(t)}
  else if(evt==='reply'){lastActivity=t; sleepBlend=0; startSpeak(String(a||''),b);setTimeout(revealReply,70)}
  else if(evt==='error'){lastActivity=t; sleepBlend=0; errEnd=t+2.6;blinkSoon(t)}
  else if(evt==='stop'){lastActivity=t; sleepBlend=0; blinkSoon(t);attnUntil=t+1}},
 setMood(name,k,hold){const key=normalizeMood(name);if(!key)return false;mood=key;moodStr=clamp(k==null?.8:k,0,1);moodHold=nowS()+(hold==null?3:hold);fire('mood',key,MOOD_LABELS[key]);return true},
 get moods(){return {...MOOD_LABELS}},
 on(e,f){(L[e]=L[e]||[]).push(f)},
 get state(){return curState}};

/* Para respuestas largas: mostrar el inicio de la respuesta (no el final) en la zona compacta */
function revealReply(){try{const all=msgsEl.querySelectorAll('.m.a');const last=all[all.length-1];
 if(last&&last.offsetHeight>scrollEl.clientHeight-24)scrollEl.scrollTop=Math.max(0,last.offsetTop-8)}catch(e){}}

/* ---------- Entrada del usuario → atención ---------- */
if(ta){
 ta.addEventListener('input',()=>{lastActivity=nowS();sleepBlend=0;attnUntil=nowS()+5;caret=((ta.selectionStart||0)%40)/40});
 ta.addEventListener('focus',()=>{lastActivity=nowS();sleepBlend=0;attnUntil=Math.max(attnUntil,nowS()+2.5)});
 ta.addEventListener('blur',()=>{attnUntil=Math.min(attnUntil,nowS()+.5)})}
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){ptrX=(e.clientX/innerWidth-.5)*2;ptrY=(e.clientY/innerHeight-.5)*2; if(Math.hypot(e.clientX-lastPointerX,e.clientY-lastPointerY)>18){lastActivity=nowS();sleepBlend=0} lastPointerX=e.clientX;lastPointerY=e.clientY}},{passive:true});
addEventListener('pointerdown',()=>{lastActivity=nowS();sleepBlend=0},{passive:true});
addEventListener('keydown',e=>{if(!['Shift','Control','Alt','Meta'].includes(e.key)){lastActivity=nowS();sleepBlend=0}},{passive:true});
addEventListener('touchstart',()=>{lastActivity=nowS();sleepBlend=0},{passive:true});

/* ---------- Lógica por fotograma (objetivos de los resortes) ---------- */
function update(t,dt){
 const b=polledBusy();
 if(b&&!prevBusy){if(antic<.5)antic=1;attnUntil=0;blinkSoon(t)}
 prevBusy=b;
 let st='idle';
 const afk=Math.max(0,t-lastActivity),sleeping=!b&&t>=speakEnd&&t>=errEnd&&t>=attnUntil&&afk>=SLEEP_AFTER;
 if(b)st='think';else if(t<speakEnd)st='speak';else if(t<errEnd)st='concern';else if(t<attnUntil)st='attn';else if(sleeping)st='sleep';
 sleepBlend+=((sleeping?1:0)-sleepBlend)*(1-Math.exp(-dt*2.2));
 if(st!==curState){const o=curState;curState=st;fire('state',st,o)}
 const B=ST[st],M=MOODS[mood]||{},mot=RM?0:1;
 const want=(t<moodHold&&st!=='think'&&st!=='concern'&&st!=='sleep')?moodStr:0;
 moodK+=(want-moodK)*(1-Math.exp(-dt*(want>moodK?3:1.1)));
 const tv=k=>B[k]+(M[k]||0)*moodK,breath=Math.sin(t*.9)*mot;
 antic=Math.max(0,antic-dt/.75);const dip=Math.sin((1-antic)*Math.PI)*(antic>0?1:0);

 /* mirada */
 if(t>gzNext){gzNext=t+rnd(st==='sleep'?2.8:1.1,st==='sleep'?5.2:3.4);if(st==='sleep'){wanderX=rnd(-.12,.12);wanderY=rnd(-.06,.08)}else if(Math.random()<.35){wanderX=0;wanderY=0}else{wanderX=rnd(-.55,.55);wanderY=rnd(-.35,.3)}}
 const wx=wanderX*mot,wy=wanderY*mot;let gx,gy;
 if(st==='sleep'){gx=.05*Math.sin(t*.28)*mot+wx*.15;gy=.2+.04*Math.sin(t*.45)*mot}
 else if(st==='think'){gx=-.5+.28*Math.sin(t*.8)*mot+wx*.2;gy=-.6+.16*Math.sin(t*1.3)*mot}
 else if(st==='attn'){gx=(caret-.5)*.9+wx*.15;gy=.5}
 else if(st==='speak'){gx=.12*Math.sin(t*.7)*mot+wx*.25;gy=.08+wy*.3}
 else if(st==='concern'){gx=wx*.2;gy=.45}
 else{gx=wx+ptrX*.35*mot;gy=wy+ptrY*.25*mot}

 /* boca: sigue el texto de la respuesta (letra a letra) o un valor externo */
 let open=0;
 if(FaceFX.mouth!=null)open=clamp(+FaceFX.mouth||0,0,1);
 else if(st==='speak'){const i=Math.floor((t-speakStart)/CH);if(i>=0&&i<speakText.length)open=mouthFor(speakText[i])}

 S.eyeW.t=tv('eyeW');S.eyeH.t=tv('eyeH')*(1+.14*antic);
 S.lid.t=tv('lid');S.slant.t=tv('slant');S.happy.t=clamp(tv('happy'),0,1);
 S.gx.t=clamp(gx,-1,1);S.gy.t=clamp(gy,-1,1);
 S.depth.t=tv('depth')+breath*.5+open*3;S.mw.t=tv('mw');S.open.t=open;
 S.earL.t=tv('earL');S.earR.t=tv('earR');S.lift.t=tv('lift');S.wr.t=tv('wr');
 S.bright.t=tv('bright')+.15*antic+open*.06+breath*.025;
 S.hx.t=gx*2.2+Math.sin(t*.37)*1.2*mot;
 S.hy.t=tv('hy')+breath*1.1+5*dip+gy*1.2+open*.8;
 S.hr.t=tv('hr')+Math.sin(t*.31)*.012*mot;
 stepS(dt);

 /* parpadeo con intervalos variables (a veces doble) */
 if(st==='sleep'){blinkT=-1;blinkV=1;nextBlink=t+1.2}
 else if(blinkT<0){if(t>=nextBlink){blinkT=0;blinkD=mood==='calm'&&moodK>.3?.22:.17}}
 else{blinkT+=dt;if(blinkT>=blinkD){blinkT=-1;if(dbl){dbl=false;nextBlink=t+.14}else{nextBlink=t+rnd(2.2,6)*(st==='think'?.8:1);dbl=Math.random()<.14}}}
 if(blinkT<0)blinkV=0;else{const u=blinkT/blinkD;blinkV=u<.38?1-Math.pow(1-u/.38,2):1-(()=>{const w=(u-.38)/.62;return w*w*(3-2*w)})()}

 if(!RM&&t>twNext&&st!=='think'){const r=Math.random();if(r<.4)twL=t;else if(r<.8)twR=t;else{twL=t;twR=t+.05}twNext=t+rnd(4,9)}
 scan+=((st==='think'&&!RM?1:0)-scan)*(1-Math.exp(-dt*3));

}

/* ---------- Rejilla de píxeles y búfer de intensidad ---------- */
let W=0,H=0,dpr=1,cols=0,rows=0,cs=8,gx0=0,gy0=0,sC=1,fxC=0,fyC=0,sT=1,fxT=0,fyT=0,curCd=3,first=true,histOpen=false;
let I,Cc,PH,gxD,gyD,gimg,g1,g2,g3,g4,gc1,gc2,gc3,gc4,bgC;
let ri0=0,ri1=0,rj0=0,rj1=0,bI0=0,bI1=0,bJ0=0,bJ1=0;
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c};

function metrics(open){
 const top=head?head.offsetHeight:48,foot=footer?footer.offsetHeight:70;
 const hh=parseFloat(main.style.getPropertyValue('--hist-h'))||110,hx=parseFloat(main.style.getPropertyValue('--hist-hx'))||300;
 const ah=Math.max(60,H-top-foot-(open?hx:hh));
 return{s:Math.min(W*.97/DW,ah*.95/DH,SMAX),fx:W/2,fy:top+ah/2}}

function setDock(){
 const H0=main.clientHeight||innerHeight,kb=root.classList.contains('kb');
 main.style.setProperty('--hist-h',(kb?76:clamp(Math.round(H0*.15),96,142))+'px');
 main.style.setProperty('--hist-hx',Math.round(Math.max(120,Math.min(H0*(innerWidth>=900?.4:.52),H0-210)))+'px');
 main.style.setProperty('--comp-h',(footer?footer.offsetHeight:70)+'px')}

function buildGrid(){
 cols=Math.ceil((W-gx0)/cs)+1;rows=Math.ceil(H/cs)+1;
 I=new Float32Array(cols*rows);Cc=new Float32Array(cols*rows);PH=new Float32Array(cols*rows);
 for(let k=0;k<PH.length;k++)PH[k]=Math.random();
 gxD=new Float32Array(cols);gyD=new Float32Array(rows);
 g1=mkC(cols,rows);gc1=g1.getContext('2d');gimg=gc1.createImageData(cols,rows);
 g2=mkC(Math.ceil(cols/2),Math.ceil(rows/2));g3=mkC(Math.ceil(cols/4),Math.ceil(rows/4));g4=mkC(Math.ceil(cols/8),Math.ceil(rows/8));

function relayout(){

 /* Cuadrícula de alta densidad: más muestras por eje, independiente del tamaño CSS. */

  ctx.setTransform(dpr,0,0,dpr,0,0);gx0=W/2-(Math.floor(W/2/cs)+.5)*cs;gy0=0;buildGrid()}

/* ---------- Primitivas: se “salpican” sobre la rejilla ---------- */
let HX=0,HY=0,CR=1,SR=0,fox=0,foy=0;const PX=DCX,PY=DCY+22;
const fwd=(x,y)=>{const dx=x-PX,dy=y-PY;fox=PX+dx*CR-dy*SR+HX;foy=PY+dx*SR+dy*CR+HY};
function range(x0,y0,x1,y1){
 ri0=Math.max(0,Math.floor(((x0-DCX)*sC+fxC-gx0)/cs));ri1=Math.min(cols-1,Math.floor(((x1-DCX)*sC+fxC-gx0)/cs));
 rj0=Math.max(0,Math.floor(((y0-DCY)*sC+fyC-gy0)/cs));rj1=Math.min(rows-1,Math.floor(((y1-DCY)*sC+fyC-gy0)/cs));
 if(ri1<ri0||rj1<rj0)return false;
 if(ri0<bI0)bI0=ri0;if(ri1>bI1)bI1=ri1;if(rj0<bJ0)bJ0=rj0;if(rj1>bJ1)bJ1=rj1;return true}
function seg(ax,ay,bx,by,th,k){
 const r=th*.5+curCd*1.6;
 if(!range(Math.min(ax,bx)-r,Math.min(ay,by)-r,Math.max(ax,bx)+r,Math.max(ay,by)+r))return;
 const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy||1e-6,hth=th*.5,cd=curCd,ct=th*.2;
 for(let j=rj0;j<=rj1;j++){const y=gyD[j],row=j*cols;
  for(let i=ri0;i<=ri1;i++){const x=gxD[i];let u=((x-ax)*vx+(y-ay)*vy)/l2;u=u<0?0:u>1?1:u;
   const dx=x-ax-vx*u,dy=y-ay-vy*u,d=Math.sqrt(dx*dx+dy*dy);let c=.5-(d-hth)/cd;if(c<=0)continue;if(c>1)c=1;
   let cc=.5-(d-ct)/cd;cc=cc<0?0:cc>1?1:cc;const idx=row+i;c*=k;cc*=k;if(c>I[idx])I[idx]=c;if(cc>Cc[idx])Cc[idx]=cc}}}
function tri(p,k){ /* triángulo relleno (convexo) */
 const n=[];let mx=0,my=0;for(let q=0;q<3;q++){mx+=p[q*2]/3;my+=p[q*2+1]/3}
 let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(let q=0;q<3;q++){const ax=p[q*2],ay=p[q*2+1],bx=p[((q+1)%3)*2],by=p[((q+1)%3)*2+1],l=Math.hypot(bx-ax,by-ay)||1;
  let nx=(by-ay)/l,ny=-(bx-ax)/l;if(nx*(mx-ax)+ny*(my-ay)>0){nx=-nx;ny=-ny}n.push(ax,ay,nx,ny);
  x0=Math.min(x0,ax);y0=Math.min(y0,ay);x1=Math.max(x1,ax);y1=Math.max(y1,ay)}
 const cd=curCd;if(!range(x0-cd*2,y0-cd*2,x1+cd*2,y1+cd*2))return;
 for(let j=rj0;j<=rj1;j++){const y=gyD[j],row=j*cols;
  for(let i=ri0;i<=ri1;i++){const x=gxD[i];let sd=-1e9;
   for(let q=0;q<12;q+=4){const v=n[q+2]*(x-n[q])+n[q+3]*(y-n[q+1]);if(v>sd)sd=v}
   let c=.5-sd/cd;if(c<=0)continue;if(c>1)c=1;let cc=.5-(sd+3)/cd;cc=cc<0?0:cc>1?1:cc;
   const idx=row+i;c*=k;cc*=k*.8;if(c>I[idx])I[idx]=c;if(cc>Cc[idx])Cc[idx]=cc}}}
function ell(ex,ey,rx,ry,k){ /* elipse rellena (boca abierta) */
 fwd(ex,ey);const cx=fox,cy=foy,R=Math.max(rx,ry)+curCd*2;if(!range(cx-R,cy-R,cx+R,cy+R))return;
 const mr=Math.min(rx,ry),cd=curCd;
 for(let j=rj0;j<=rj1;j++){const y=gyD[j],row=j*cols;
  for(let i=ri0;i<=ri1;i++){const x=gxD[i],u=(x-cx)/rx,v=(y-cy)/ry,de=(Math.sqrt(u*u+v*v)-1)*mr;
   let c=.5-de/cd;if(c<=0)continue;if(c>1)c=1;let cc=.5+(-de-2)/cd;cc=cc<0?0:cc>1?1:cc;
   const idx=row+i;c*=k;cc*=k*.6;if(c>I[idx])I[idx]=c;if(cc>Cc[idx])Cc[idx]=cc}}}
function eye(side){
 const ex0=side<0?EYE_X:2*DCX-EYE_X,hp=S.happy.v;
 const rx=EYE_RX*S.eyeW.v;let ry=EYE_RY*S.eyeH.v*(1-.9*blinkV)*(1-.2*hp);if(ry<2.6)ry=2.6;
 const ex=ex0+S.gx.v*8,ey=EYE_Y+S.gy.v*6.5;
 fwd(ex,ey);const cx=fox,cy=foy,R=Math.max(rx,ry)+curCd*2;if(!range(cx-R,cy-R,cx+R,cy+R))return;
 const lid=S.lid.v,sl=S.slant.v,mr=Math.min(rx,ry),cd=curCd,vb=-1+2*lid,shift=2.8-hp*2.9,sg=side<0?-1:1;
 const useLid=lid>.002||sl>.002||sl<-.002;
 for(let j=rj0;j<=rj1;j++){const y=gyD[j],row=j*cols;
  for(let i=ri0;i<=ri1;i++){const x=gxD[i],dx=x-HX-PX,dy=y-HY-PY,qx=PX+dx*CR+dy*SR,qy=PY-dx*SR+dy*CR;
   const u=(qx-ex)/rx,v=(qy-ey)/ry,de=(Math.sqrt(u*u+v*v)-1)*mr;let c=.5-de/cd;if(c<=0)continue;
   if(useLid){const cl=.5+(v-(vb-sl*u*sg))*ry/cd;if(cl<=0)continue;if(cl<c)c=cl}
   if(hp>.01){const uu=u*.93,vv=v-shift,c2=.5-((Math.sqrt(uu*uu+vv*vv)-1)*mr)/cd;if(c2>0){const f=1-(c2>1?1:c2);if(f<c)c=f}}
   if(c<=0)continue;if(c>1)c=1;let cc=.5+(-de-5)/cd;cc=(cc<0?0:cc>1?1:cc)*.62*c;
   const idx=row+i;if(c>I[idx])I[idx]=c;if(cc>Cc[idx])Cc[idx]=cc}}
 /* Reflejo pixelado: pequeños destellos siguen la mirada y se recalculan cada fotograma. */
 const hx=cx-rx*.24+S.gx.v*1.8,hy=cy-ry*.34+S.gy.v*1.2;

}
function ear(side){
 const ang=side<0?-(S.earL.v+tw(twL)):(S.earR.v+tw(twR)),ca=Math.cos(ang),sa=Math.sin(ang),lift=S.lift.v,sy=1+.012*lift;
 const px=side<0?EAR_PIV[0]:2*DCX-EAR_PIV[0],py=EAR_PIV[1];

  let dx=x-px,dy=(y-py)*sy;x=px+dx*ca-dy*sa;y=py+dx*sa+dy*ca-lift;fwd(x,y);out.push(fox,foy)}return out};
 const o=T(EAR_OUT);seg(o[0],o[1],o[2],o[3],7.4,1);seg(o[2],o[3],o[4],o[5],7.4,1);

let NOW=0;const tw=t0=>{const u=NOW-t0;return u<0||u>.6?0:Math.sin(u*30)*Math.exp(-u*7)*.2};
function whiskers(t){
 for(let side=-1;side<=1;side+=2)for(let n=0;n<3;n++){
  const w=WHISK[n];let ox=side<0?w[0][0]:2*DCX-w[0][0],oy=w[0][1],bx=side<0?w[1][0]:2*DCX-w[1][0],by=w[1][1];
  const a=(S.wr.v+(RM?0:Math.sin(t*1.7+n*1.3+side)*.03))*(side<0?1:-1),vx=ox-bx,vy=oy-by,ca=Math.cos(a),sa=Math.sin(a);

function mouth(){

/* ---------- Dibujo ---------- */
const NB=12*4,PAL=[];

 const r=lerp(lerp(6,14,v),200,cw),g=lerp(lerp(80,214,Math.pow(v,.8)),250,cw),b=lerp(lerp(170,246,Math.pow(v,.6)),255,cw);

function render(t){

 for(let j=bJ0;j<=bJ1;j++){const row=j*cols;
  for(let i=bI0;i<=bI1;i++){const idx=row+i,b0=I[idx];if(b0<.035)continue;

   if(v>1)v=1;const l=(v*11)|0,c=(Cc[idx]*3.99)|0;BK[l*4+c].push(idx,i,j)}}

}

/* ---------- Bucle único de animación ---------- */

 /(?:^|\s)(?:me llamo|mi nombre es|llámame|my name is|call me|me chamo|meu nome é|je m'appelle|mon prénom est|mi chiamo|il mio nome è)\s/i,

 const c=cur();$('#ttl').textContent=c.messages.length?c.title:'';
 if(!c.messages.length){msgs.innerHTML=`<div class="welcome"><span class="tile" style="width:min(150px,45vw);margin-bottom:8px"><img src="${ICON}" alt="Tanuki"></span><span class="tile"><img src="${LOGO}" alt="Tanuki" style="width:min(240px,64vw)"></span><h1>${tr('¿En qué estás pensando?')}</h1><p>${tr('Escribe tu mensaje para comenzar una conversación')}</p><div class="sug">${SUGS.map(s=>`<button data-act="sug">${tr(s)}</button>`).join('')}</div></div>`;return}
 msgs.innerHTML=c.messages.map(m=>m.role==='user'?`<div class="m u">${m.files&&m.files.length?`<div class="fl">${m.files.map(f=>fileCard(f)).join('')}</div>`:''}${m.content?`<div class="b">${esc(m.content)}</div>`:''}<div class="meta">${when(m.at)}</div></div>`:`<div class="m a"><div class="b">${md(m.content)}</div><div class="meta"><button class="ib" data-act="copy" data-id="${m.id}" title="${tr('Copiar')}" aria-label="${tr('Copiar mensaje')}">${ic('copy')}</button>${when(m.at)}</div></div>`).join('')+(busy&&busy.convId===c.id?'<div class="m a" aria-label="'+tr('Tanuki está escribiendo')+'"><div class="dots"><i></i><i></i><i></i></div></div>':'')}
function renderAtt(){$('#att').innerHTML=pending.map(f=>fileCard(f,1)).join('');updSend()}
function updSend(){const b=$('#sendb');if(busy){b.innerHTML=ic('stop');b.title=b.ariaLabel=tr('Detener respuesta');b.disabled=false}else{b.innerHTML=ic('up');b.title=tr('Enviar');b.ariaLabel=tr('Enviar mensaje');b.disabled=!(ta.value.trim()||pending.length)}}
function render(keep){renderList();renderChat();renderAtt();if(!keep)toBottom(true);else near()&&toBottom()}
const near=()=>scr.scrollHeight-scr.scrollTop-scr.clientHeight<140;
const toBottom=(i)=>{scr.scrollTo({top:scr.scrollHeight,behavior:i?'auto':'smooth'})};
scr.addEventListener('scroll',()=>$('#down').classList.toggle('show',!near()));
function resize(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,200)+'px'}
/* Diálogos */
function dialog(html,onMount){return new Promise(res=>{const o=document.createElement('div');o.className='mo';o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;const prev=document.activeElement;
 const close=v=>{o.remove();document.removeEventListener('keydown',kd);prev&&prev.focus&&prev.focus();res(v)};
 const kd=e=>{if(e.key==='Escape')close(null)};document.addEventListener('keydown',kd);
 o.addEventListener('mousedown',e=>{if(e.target===o)close(null)});document.body.append(o);iconize(o);onMount&&onMount(o,close);
 (o.querySelector('input[type=text],.p,.d,.btn')||o).focus()})}
const confirmDlg=(title,text,ok,danger)=>dialog(`<h2>${tr(title)}</h2><p>${tr(text)}</p><div class="acts"><button class="btn" data-v="0">${tr('Cancelar')}</button><button class="btn ${danger?'d':'p'}" data-v="1">${tr(ok)}</button></div>`,(o,c)=>o.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>c(b.dataset.v==='1'))).then(v=>!!v);
async function rename(id){const c=conv(id);const v=await dialog(`<h2>${tr('Renombrar conversación')}</h2><input type="text" maxlength="80" value="${esc(c.title)}" aria-label="${tr('Título')}"><div class="acts"><button class="btn" data-v="0">${tr('Cancelar')}</button><button class="btn p" data-v="1">${tr('Guardar')}</button></div>`,(o,cl)=>{const i=o.querySelector('input');i.select();const go=()=>cl(i.value);o.querySelector('[data-v="1"]').onclick=go;o.querySelector('[data-v="0"]').onclick=()=>cl(null);i.onkeydown=e=>{if(e.key==='Enter')go()}});
 if(v&&v.trim()){c.title=v.trim();c.renamed=1;save();render(1);toast(tr('Conversación renombrada'))}}
async function del(id){if(!await confirmDlg('¿Eliminar conversación?','Se eliminará de forma permanente de este dispositivo. No se puede deshacer.','Eliminar',1))return;
 if(busy&&busy.convId===id){clearTimeout(busy.timer);busy=null}
 data.convs=data.convs.filter(c=>c.id!==id);if(data.active===id)newConv();save();render();toast(tr('Conversación eliminada'))}
async function clearAll(){if(!await confirmDlg('¿Borrar todo el historial?','Se eliminarán todas las conversaciones de este dispositivo. No se puede deshacer.','Borrar todo',1))return;
 if(busy){clearTimeout(busy.timer);busy=null}data={convs:[],active:null};newConv();save();render();toast(tr('Historial borrado'))}
/* Menú contextual */
const menu=$('#menu');
function openMenu(btn,id){menu.innerHTML=`<button role="menuitem" data-act="ren" data-id="${id}">${ic('pencil')}${tr('Renombrar')}</button><button role="menuitem" class="dg" data-act="del" data-id="${id}">${ic('trash')}${tr('Eliminar')}</button><button role="menuitem" data-act="mx">${tr('Cancelar')}</button>`;menu.hidden=false;
 const r=btn.getBoundingClientRect();menu.style.top=Math.min(r.bottom+4,innerHeight-menu.offsetHeight-8)+'px';menu.style.left=Math.max(8,Math.min(r.right-menu.offsetWidth,innerWidth-menu.offsetWidth-8))+'px';menu.querySelector('button').focus()}
const closeMenu=()=>{menu.hidden=true};
document.addEventListener('mousedown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!e.target.closest('[data-act=cmenu]'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();app.classList.remove('open')}});
/* Archivos */
function addFiles(list){let added=0;for(const f of list){
 if(!OK.includes(ext(f.name))){toast(tr('«{n}» no es un tipo admitido (PNG, JPG, WEBP, PDF, TXT, MD, CSV, JSON).',{n:f.name}),1);continue}
 if(f.size>10485760){toast(tr('«{n}» supera los 10 MB.',{n:f.name}),1);continue}
 if(pending.some(p=>p.name===f.name&&p.size===f.size&&p.mod===f.lastModified)){toast(tr('«{n}» ya está adjunto.',{n:f.name}),1);continue}
 if(pending.length>=5){toast(tr('Máximo 5 archivos por mensaje.'),1);break}
 const id=uid();let url=null;if(IMG.includes(ext(f.name)))url=URL.createObjectURL(f);previews.set(id,url);pending.push({id,name:f.name,type:f.type,size:f.size,mod:f.lastModified,url});added++}
 if(added)toast(tr(added>1?'{n} archivos adjuntados':'{n} archivo adjuntado',{n:added}));renderAtt()}
/* Envío */
function send(){if(busy)return stop();const t=ta.value.trim();if(!t&&!pending.length)return;
 const c=cur(),m={id:uid(),role:'user',content:t,at:Date.now(),files:pending.map(({id,name,type,size})=>({id,name,type,size}))};
 c.messages.push(m);c.updated=Date.now();if(c.messages.length===1&&!c.renamed)c.title=mkTitle(t||pending[0].name);
 autoMem(t);pending=[];ta.value='';resize();
 const tok=uid();busy={convId:c.id,tok,model,timer:setTimeout(()=>reply(c.id,tok),1400)};
 save();render();toBottom(true);fx('send',t);ta.focus()}
async function reply(id,tok){if(!busy||busy.tok!==tok)return;const mdl=busy.model;let text;try{text=await AIService.reply(id,mdl)}catch(err){if(!busy||busy.tok!==tok)return;busy=null;const c=conv(id);if(c){c.messages.push({id:uid(),role:'assistant',content:tr('No pude conectar con la IA. Revisa que el Worker de Cloudflare esté desplegado y que Workers AI esté habilitado. Detalle: {d} · Modelo seleccionado: {m}',{d:err?.message||tr('error desconocido'),m:MODEL_BY[mdl]?.name||mdl}),at:Date.now()});c.updated=Date.now();save()}renderList();updSend();if(id===data.active){renderChat();near()&&toBottom()}fx('error');return}if(!busy||busy.tok!==tok)return;busy=null;const c=conv(id);
 if(c){c.messages.push({id:uid(),role:'assistant',content:text,at:Date.now()});c.updated=Date.now();save()}
 renderList();updSend();if(id===data.active){renderChat();near()&&toBottom()}fx('reply',text)}
function stop(){if(!busy)return;clearTimeout(busy.timer);busy=null;render(1);fx('stop');toast(tr('Respuesta detenida'))}
/* Acciones */
async function newChat(){if(ta.value.trim()||pending.length){if(!await confirmDlg('¿Descartar el mensaje?','Tienes texto o archivos sin enviar. Se perderán.','Descartar',1))return}
 pending=[];ta.value='';resize();newConv();render();app.classList.remove('open');ta.focus()}
/* Selector de modelos */
const mdlb=$('#mdlb'),mdlm=$('#mdl');
function renderModelBtn(){const m=MODEL_BY[model];mdlb.innerHTML=`<span class="e" aria-hidden="true">${m.emoji}</span><span class="n">${m.name}</span>${ic('down')}`;mdlb.setAttribute('aria-label',tr('Modelo: {n}. Cambiar modelo',{n:m.name}));mdlb.title=m.name+' · '+tr(m.short)}
function closeModels(f){mdlm.hidden=true;mdlb.setAttribute('aria-expanded','false');if(f)mdlb.focus()}
function openModels(){
 mdlm.innerHTML=MODELS.map(m=>`<button type="button" class="mo-i" role="menuitemradio" aria-checked="${m.key===model}" data-act="pick" data-k="${m.key}"><span class="e" aria-hidden="true">${m.emoji}</span><span class="tx"><span class="h"><b>${m.name}</b><span>${tr(m.short)}</span>${m.key===DEFAULT_MODEL?'<span class="tag">'+tr('Predeterminado')+'</span>':''}</span><span class="ds">${tr(m.desc)}</span></span>${ic('check').replace('class="i"','class="i ck"')}</button>`).join('');
 mdlm.hidden=false;mdlb.setAttribute('aria-expanded','true');
 const r=mdlb.getBoundingClientRect(),w=Math.min(360,innerWidth-16);
 mdlm.style.width=w+'px';mdlm.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
 mdlm.style.bottom=(innerHeight-r.top+8)+'px';mdlm.style.maxHeight=Math.max(160,r.top-16)+'px';
 (mdlm.querySelector('[aria-checked=true]')||mdlm.querySelector('button')).focus()}
function pickModel(k){if(!MODEL_BY[k])return;model=k;try{localStorage.setItem('rcn.model',JSON.stringify(k))}catch{}renderModelBtn();closeModels(1)}
document.addEventListener('mousedown',e=>{if(!mdlm.hidden&&!mdlm.contains(e.target)&&!e.target.closest('#mdlb'))closeModels()});
document.addEventListener('keydown',e=>{if(mdlm.hidden)return;if(e.key==='Escape'){e.stopPropagation();closeModels(1)}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const L=[...mdlm.querySelectorAll('button')],i=L.indexOf(document.activeElement);L[(i+(e.key==='ArrowDown'?1:-1)+L.length)%L.length].focus()}
 else if(e.key==='Tab')closeModels()});
addEventListener('resize',()=>{if(!mdlm.hidden)closeModels()});
renderModelBtn();
const A={
 new:newChat,settings,close:()=>app.classList.remove('open'),menu:()=>app.classList.add('open'),
 collapse:()=>app.classList.toggle('collapsed'),
 clearq:()=>{$('#q').value='';q='';renderList();$('#q').focus()},
 attach:()=>$('#fi').click(),send,model:()=>mdlm.hidden?openModels():closeModels(),pick:b=>pickModel(b.dataset.k),down:()=>toBottom(),
 sug:(b)=>{ta.value=b.textContent;resize();updSend();ta.focus()},
 open:b=>{data.active=b.dataset.id;app.classList.remove('open');render()},
 cmenu:b=>openMenu(b,b.dataset.id),ren:b=>{closeMenu();rename(b.dataset.id)},del:b=>{closeMenu();del(b.dataset.id)},mx:closeMenu,
 rmf:b=>{const f=pending.find(p=>p.id===b.dataset.id);if(f&&f.url)URL.revokeObjectURL(f.url);pending=pending.filter(p=>p!==f);renderAtt()},
 copy:async b=>{const m=cur().messages.find(x=>x.id===b.dataset.id);try{await navigator.clipboard.writeText(m.content);b.innerHTML=ic('check');toast(tr('Copiado'));setTimeout(()=>b.innerHTML=ic('copy'),1600)}catch{toast(tr('No se pudo copiar al portapapeles.'),1)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b)});
ta.addEventListener('input',()=>{resize();updSend()});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#fi').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
iconize();initStatic();applyLang();if(!prefs.sidebarStart&&innerWidth>800)app.classList.add('collapsed');
render();
</script>
</body>
</html>
