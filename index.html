:root[data-eff=dark]{--bg:#181818;--side:#101010;--surf:#262626;--soft:#2b2b2b;--hov:#383838;--bd:#333;--bd2:#4d4d4d;--tx:#f5f5f5;--mut:#a9a9a9;--ac2:#ff6b7c;--ring:#5aa9ff;--dg:#e60023;--code:#0c0c0c;--p1:#46222b;--p2:#42371a;--p3:#203a2b;--p4:#1e3450;--ptx:#f5f5f5;--pic:rgba(255,255,255,.14);--sh:0 10px 36px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
html,body{height:100%;margin:0}
body{font:16px/1.55 Figtree,"Helvetica Neue",Arial,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex:none;transition:background .15s}
.ib:hover{background:var(--hov)}
#app{display:flex;height:var(--vvh,100%)}
html.kb body{padding-bottom:0}
html.kb #app{height:calc(var(--vvh) - env(safe-area-inset-top,0px));transform:translateY(var(--vvt,0px))}
html.kb .note{display:none}
/* Panel lateral */
#side{width:272px;flex:none;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 10px;background:var(--side);border-right:1px solid var(--bd);transition:width .2s}
.sh{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 0 6px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.tile{display:grid;place-items:center;flex:none}.tile img{width:100%;height:100%;object-fit:contain;display:block}
.t36{width:36px;height:36px}.t56{width:84px;height:25px}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:999px;background:var(--ac);color:var(--acx);font-weight:700;transition:filter .15s,transform .1s}
.newbtn:hover{filter:brightness(.9)}.newbtn:active{transform:scale(.98)}
.srch{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:999px;background:var(--soft);border:2px solid transparent;color:var(--mut)}
.srch:focus-within{background:var(--surf);border-color:var(--ring)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;color:var(--tx);font-size:15px}
.srch input::placeholder{color:var(--mut)}
.srch .ib{width:30px;height:30px;color:var(--mut)}
#list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.ci{display:flex;align-items:center;border-radius:14px;min-height:44px}
.ci:hover,.ci:focus-within{background:var(--soft)}.ci.on{background:var(--hov)}
.ci .open{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 4px 10px 12px;text-align:left}
.ci .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.ci.on .t{font-weight:700}
.ci .d{flex:none;font-size:12px;color:var(--mut)}
.ci .ib{width:32px;height:32px;margin-right:4px;color:var(--mut);opacity:0}
.ci:hover .ib,.ci:focus-within .ib,.ci.on .ib{opacity:1}
@media(hover:none){.ci .ib{opacity:1}}
.empty{color:var(--mut);text-align:center;padding:28px 8px;font-size:14px}
.sf{border-top:1px solid var(--bd);padding-top:10px}
.sf button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 12px;border-radius:14px;font-weight:600}
.sf button:hover{background:var(--soft)}
.collapsed #side{width:72px;align-items:center}
.collapsed .lb,.collapsed .t56,.collapsed #list{display:none}
.collapsed .sh{flex-direction:column;gap:10px;padding:0}
.collapsed .newbtn,.collapsed .sf button{width:46px;padding:0;justify-content:center}
/* Cabecera y chat */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;gap:6px;height:56px;padding:0 12px}
.top .mbtn,.top .tnew{display:none}
#ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.mdlb{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 10px;border-radius:999px;font-size:17px;font-weight:700;white-space:nowrap;max-width:60vw;transition:background .15s}
.mdlb:hover,.mdlb[aria-expanded=true]{background:var(--soft)}
.mdlb .e{font-size:18px;line-height:1}.mdlb .n{overflow:hidden;text-overflow:ellipsis}
.mdlb .i{width:16px;height:16px;color:var(--mut);transition:transform .15s}.mdlb[aria-expanded=true] .i{transform:rotate(180deg)}
#scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#msgs{max-width:768px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:28px;min-height:100%}
/* Bienvenida: ideas como pines */
.welcome{margin:auto;width:100%;text-align:center;padding:8px 0 16px}
.welcome .tile:first-child{width:60px!important;height:60px;margin:0 auto 18px!important}
.welcome .tile:first-child img{border-radius:50%}
.welcome .tile+.tile{display:none}
.welcome h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 10px;letter-spacing:-.03em;font-weight:800}
.welcome p{color:var(--mut);margin:0 0 28px}
.sug{column-count:2;column-gap:12px;max-width:880px;margin:0 auto;text-align:left}
.sug button{position:relative;display:block;width:100%;break-inside:avoid;margin:0 0 12px;padding:16px;min-height:128px;border-radius:24px;background:var(--p1);color:var(--ptx);font-weight:700;font-size:17px;line-height:1.25;text-align:left;transition:transform .15s,box-shadow .15s}
.sug button:nth-child(1),.sug button:nth-child(4){min-height:176px}
.sug button:nth-child(2){background:var(--p2)}.sug button:nth-child(3){background:var(--p3)}.sug button:nth-child(4){background:var(--p4)}
.sug button:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.sug button::before{content:"";display:block;width:38px;height:38px;margin-bottom:14px;border-radius:50%;background:var(--pic)}

const comp=()=>{if(main&&footer)main.style.setProperty('--comp-h',footer.offsetHeight+'px')};
function fit(){const h=vv?vv.height:innerHeight,kb=(innerHeight-h)>130;
 root.classList.toggle('kb',kb);
 if(kb){root.style.setProperty('--vvh',Math.round(h)+'px');root.style.setProperty('--vvt',Math.round(vv.offsetTop||0)+'px')}
 else{root.style.removeProperty('--vvh');root.style.removeProperty('--vvt')}
 comp()}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',()=>{if(root.classList.contains('kb')){root.style.setProperty('--vvt',Math.round(vv.offsetTop||0)+'px');scrollTo(0,0)}})}

if(window.ResizeObserver&&footer)new ResizeObserver(comp).observe(footer);

 if(s&&innerWidth>800&&!s.contains(e.target)&&!e.target.closest('.mo,#toasts')){e.preventDefault();e.stopPropagation();if(typeof closeSet==='function')closeSet()}},true);

})();

let model=(k=>MODEL_BY[k]?k:DEFAULT_MODEL)((()=>{try{return JSON.parse(localStorage.getItem('rcn.model'))}catch{return null}})());
/* Servicio de IA conectado a Cloudflare Workers AI. */
const AIService={async reply(id,model){
 const c=conv(id);
 const messages=(c?.messages||[])
  .filter(m=>['user','assistant'].includes(m.role)&&typeof m.content==='string')
  .slice(-10)
  .map(m=>({role:m.role,content:m.content}));
 const ctx=aiContext();if(ctx)messages.unshift({role:'system',content:ctx});
 const response=await fetch(WORKER_URL,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({messages,model:model||DEFAULT_MODEL})
 });
 let result={};
 try{result=await response.json()}catch{}
 if(!response.ok)throw new Error(result.error||`Error HTTP ${response.status}`);
 if(typeof result.text!=='string'||!result.text.trim())throw new Error(tr('La IA devolvió una respuesta vacía.'));
 return result.text.trim();
}};

/* tr(clave_en_español, {variables}) → texto en el idioma activo (si falta, queda en español) */
function tr(s,v){let r=(I18N[prefs.lang]||{})[s];if(r===undefined)r=s;return v?r.replace(/\{(\w+)\}/g,(_,k)=>v[k]===undefined?'':v[k]):r}
let STATIC=null;
function initStatic(){STATIC={txt:[],att:[]};
 const w=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.nodeValue.trim())STATIC.txt.push([n,n.nodeValue]);
 document.querySelectorAll('#app [title],#app [aria-label],#app [placeholder],#app [alt]').forEach(e=>{if(e.id==='sendb'||e.id==='mdlb')return;['title','aria-label','placeholder','alt'].forEach(a=>{if(e.hasAttribute(a))STATIC.att.push([e,a,e.getAttribute(a)])})})}
function applyLang(){document.documentElement.lang=prefs.lang;
 STATIC.txt.forEach(([n,o])=>{const k=o.trim();n.nodeValue=o.replace(k,()=>tr(k))});
 STATIC.att.forEach(([e,a,o])=>e.setAttribute(a,tr(o)));
 renderModelBtn();render(1)}
/* Recuerdos */
let mem=Store.get('rcn.mem',{on:true,items:[]});
if(!mem||!Array.isArray(mem.items))mem={on:true,items:[]};
const saveMem=()=>Store.set('rcn.mem',mem);
function addMem(text,auto){text=text.replace(/\s+/g,' ').trim().slice(0,200);if(!text)return false;
 if(mem.items.some(i=>i.text.toLowerCase()===text.toLowerCase()))return 'dup';

const MEM_EXPLICIT=/^(?:por favor,?\s*)?(?:recuerda|recuérdame|acuérdate de|ten en cuenta|remember|please remember|don't forget|souviens-toi|rappelle-toi|lembra|lembre-se|ricorda|ricordati)(?:\s+(?:que|that|de que|che|de))?[:,]?\s+(.{4,})/i;
const MEM_PATS=[
 /(?:^|\s)(?:me llamo|mi nombre es|llámame|my name is|call me|me chamo|meu nome é|je m'appelle|mon prénom est|mi chiamo|il mio nome è)\s/i,
 /(?:^|\s)(?:vivo en|i live in|moro em|j'habite|vivo a|abito)\s/i,
 /(?:^|\s)(?:trabajo (?:como|en|de)|i work (?:as|at|in|for)|i study|trabalho (?:como|em)|je travaille|j'étudie|lavoro (?:come|in))\s/i,
 /(?:^|\s)(?:me gusta(?:n)?|me encanta(?:n)?|no me gusta(?:n)?|prefiero|i (?:really )?(?:like|love|prefer|hate|don't like|dislike)|eu (?:gosto|prefiro|amo)|j'aime|je préfère|mi piace|preferisco)\s/i,
 /\sfavorit[oa]s?\s(?:es|son)\s|favou?rite \w+ is\s|\sfavorito é\s|\spréféré est\s|\spreferito è\s/i];
function autoMem(txt){if(!mem.on)return;let n=0;
 for(let s of (txt.match(/[^.!?\n]+[.!?]*/g)||[])){s=s.replace(/\s+/g,' ').trim();if(s.length<8||s.length>160||/\?\s*$/.test(s))continue;
  const m=s.match(MEM_EXPLICIT);let out=m?m[1]:(MEM_PATS.some(r=>r.test(s))?s:null);if(!out)continue;
  out=out.replace(/^["'«¿¡]+|["'»]+$/g,'').trim();out=out.charAt(0).toUpperCase()+out.slice(1);
  if(addMem(out,true)===true&&++n>=2)break}

 const tok=uid();busy={convId:c.id,tok,model,timer:setTimeout(()=>reply(c.id,tok),1400)};
 save();render();toBottom(true);fx('send',t);ta.focus()}
async function reply(id,tok){if(!busy||busy.tok!==tok)return;const mdl=busy.model;let text;try{text=await AIService.reply(id,mdl)}catch(err){if(!busy||busy.tok!==tok)return;busy=null;const c=conv(id);if(c){c.messages.push({id:uid(),role:'assistant',content:tr('No pude conectar con la IA. Revisa que el Worker de Cloudflare esté desplegado y que Workers AI esté habilitado. Detalle: {d} · Modelo seleccionado: {m}',{d:err?.message||tr('error desconocido'),m:MODEL_BY[mdl]?.name||mdl}),at:Date.now()});c.updated=Date.now();save()}renderList();updSend();if(id===data.active){renderChat();near()&&toBottom()}fx('error');return}if(!busy||busy.tok!==tok)return;busy=null;const c=conv(id);
 if(c){c.messages.push({id:uid(),role:'assistant',content:text,at:Date.now()});c.updated=Date.now();save()}
 renderList();updSend();if(id===data.active){renderChat();near()&&toBottom()}fx('reply',text)}
function stop(){if(!busy)return;clearTimeout(busy.timer);busy=null;render(1);fx('stop');toast(tr('Respuesta detenida'))}
/* Acciones */
async function newChat(){if(ta.value.trim()||pending.length){if(!await confirmDlg('¿Descartar el mensaje?','Tienes texto o archivos sin enviar. Se perderán.','Descartar',1))return}
 pending=[];ta.value='';resize();newConv();render();app.classList.remove('open');ta.focus()}
/* Selector de modelos */
const mdlb=$('#mdlb'),mdlm=$('#mdl');
function renderModelBtn(){const m=MODEL_BY[model];mdlb.innerHTML=`<span class="e" aria-hidden="true">${m.emoji}</span><span class="n">${m.name}</span>${ic('down')}`;mdlb.setAttribute('aria-label',tr('Modelo: {n}. Cambiar modelo',{n:m.name}));mdlb.title=m.name+' · '+tr(m.short)}
function closeModels(f){mdlm.hidden=true;mdlb.setAttribute('aria-expanded','false');if(f)mdlb.focus()}
function openModels(){
 mdlm.innerHTML=MODELS.map(m=>`<button type="button" class="mo-i" role="menuitemradio" aria-checked="${m.key===model}" data-act="pick" data-k="${m.key}"><span class="e" aria-hidden="true">${m.emoji}</span><span class="tx"><span class="h"><b>${m.name}</b><span>${tr(m.short)}</span>${m.key===DEFAULT_MODEL?'<span class="tag">'+tr('Predeterminado')+'</span>':''}</span><span class="ds">${tr(m.desc)}</span></span>${ic('check').replace('class="i"','class="i ck"')}</button>`).join('');
 mdlm.hidden=false;mdlb.setAttribute('aria-expanded','true');
 const r=mdlb.getBoundingClientRect(),w=Math.min(360,innerWidth-16);
 mdlm.style.width=w+'px';mdlm.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
 mdlm.style.bottom=(innerHeight-r.top+8)+'px';mdlm.style.maxHeight=Math.max(160,r.top-16)+'px';
 (mdlm.querySelector('[aria-checked=true]')||mdlm.querySelector('button')).focus()}
function pickModel(k){if(!MODEL_BY[k])return;model=k;try{localStorage.setItem('rcn.model',JSON.stringify(k))}catch{}renderModelBtn();closeModels(1)}
document.addEventListener('mousedown',e=>{if(!mdlm.hidden&&!mdlm.contains(e.target)&&!e.target.closest('#mdlb'))closeModels()});
document.addEventListener('keydown',e=>{if(mdlm.hidden)return;if(e.key==='Escape'){e.stopPropagation();closeModels(1)}
 else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const L=[...mdlm.querySelectorAll('button')],i=L.indexOf(document.activeElement);L[(i+(e.key==='ArrowDown'?1:-1)+L.length)%L.length].focus()}
 else if(e.key==='Tab')closeModels()});
addEventListener('resize',()=>{if(!mdlm.hidden)closeModels()});
renderModelBtn();
const A={
 new:newChat,settings,close:()=>app.classList.remove('open'),menu:()=>app.classList.add('open'),
 collapse:()=>app.classList.toggle('collapsed'),
 clearq:()=>{$('#q').value='';q='';renderList();$('#q').focus()},
 attach:()=>$('#fi').click(),send,model:()=>mdlm.hidden?openModels():closeModels(),pick:b=>pickModel(b.dataset.k),down:()=>toBottom(),
 sug:(b)=>{ta.value=b.textContent;resize();updSend();ta.focus()},
 open:b=>{data.active=b.dataset.id;app.classList.remove('open');render()},
 cmenu:b=>openMenu(b,b.dataset.id),ren:b=>{closeMenu();rename(b.dataset.id)},del:b=>{closeMenu();del(b.dataset.id)},mx:closeMenu,
 rmf:b=>{const f=pending.find(p=>p.id===b.dataset.id);if(f&&f.url)URL.revokeObjectURL(f.url);pending=pending.filter(p=>p!==f);renderAtt()},
 copy:async b=>{const m=cur().messages.find(x=>x.id===b.dataset.id);try{await navigator.clipboard.writeText(m.content);b.innerHTML=ic('check');toast(tr('Copiado'));setTimeout(()=>b.innerHTML=ic('copy'),1600)}catch{toast(tr('No se pudo copiar al portapapeles.'),1)}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b)});
ta.addEventListener('input',()=>{resize();updSend()});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#fi').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
iconize();initStatic();applyLang();if(!prefs.sidebarStart&&innerWidth>800)app.classList.add('collapsed');
render();
</script>
